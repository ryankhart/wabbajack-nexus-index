name: Update Wabbajack index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: read

concurrency:
  group: wabbajack-index-update
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore durable index state
        uses: actions/cache@v4
        with:
          path: |
            data/cache/http
            data/generated/database.sqlite
          key: wabbajack-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            wabbajack-state-${{ runner.os }}-

      - name: Build complete registered index
        run: >-
          python -m pipeline build
          --workers 6
          --database data/generated/database.sqlite
          --output data/generated/public

      - name: Verify pipeline and extension
        run: npm run verify

      - name: Upload database, coverage, and browser packages
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: wabbajack-nexus-index-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 7
          path: |
            data/generated/database.sqlite
            data/generated/public
            dist/chrome
            dist/firefox
            artifacts/wabbajack-nexus-index-chrome-v0.1.0.zip
            artifacts/wabbajack-nexus-index-firefox-v0.1.0.xpi

      - name: Configure GitHub Pages
        if: ${{ vars.ENABLE_PAGES_DEPLOYMENT == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload verified Pages dataset
        if: ${{ vars.ENABLE_PAGES_DEPLOYMENT == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: data/generated/public

  deploy-pages:
    if: ${{ vars.ENABLE_PAGES_DEPLOYMENT == 'true' }}
    needs: build-index
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified dataset to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
