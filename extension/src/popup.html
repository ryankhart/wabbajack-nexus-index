<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wabbajack Nexus Index</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="popup" aria-labelledby="popup-title">
      <header class="popup-header">
        <img
          class="popup-logo"
          src="assets/wabbajack-transparent.webp"
          alt=""
          aria-hidden="true"
        >
        <div>
          <h1 id="popup-title">Wabbajack Nexus Index</h1>
          <p>Bundled data status</p>
        </div>
      </header>
      <section class="popup-status" role="status" aria-live="polite">
        <span class="popup-label">Index updated</span>
        <time id="index-updated">Loading…</time>
      </section>
    </main>
  </body>
</html>
