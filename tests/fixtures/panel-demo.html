<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus fixture — Wabbajack panel</title>
  <link rel="stylesheet" href="/extension/src/content.css">
  <style>
    body { margin: 0; background: #1d1d22; color: #eee; font: 15px Arial, sans-serif; }
    main { max-width: 1020px; margin: 48px auto; }
    h2 { font-size: 28px; font-weight: 400; }
    .copy { line-height: 1.55; color: #ddd; margin-bottom: 28px; }
    .accordion { background: #303036; }
    .accordion-row { border-bottom: 1px solid #44444a; }
    .accordion-row > button { display: flex; width: 100%; padding: 13px 12px; border: 0; background: transparent; color: #f5f5f5; font: inherit; font-weight: 700; text-align: left; }
    .collections-body { padding: 20px; background: #44444a; color: #ddd; }
  </style>
</head>
<body>
  <main>
    <section>
      <h2>About this mod</h2>
      <p class="copy">A controlled Nexus-shaped page used to verify the extension's real DOM insertion and rendering behavior.</p>
      <div class="accordion">
        <div class="accordion-row"><button>Requirements</button></div>
        <div class="accordion-row"><button>Permissions and credits</button></div>
        <div class="accordion-row"><button>Changelogs</button></div>
        <div class="accordion-row">
          <button>Collections containing this mod</button>
          <div class="collections-body">Included in 173 Nexus Collections</div>
        </div>
      </div>
    </section>
  </main>
  <script type="module">
    import * as core from "/extension/src/core.mjs";
    globalThis.WJNI = Object.freeze({
      ...core,
      parseNexusModUrl: () => ({ gameDomain: "skyrimspecialedition", modId: 42 }),
    });
    globalThis.chrome = {
      runtime: { getURL: (relative) => `/tests/fixtures/${relative}` },
    };
    await import("/extension/src/content-entry.js");
  </script>
</body>
</html>
